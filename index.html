<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="description" content="Daily Progress — jadwal dan progress aktivitas harian berbasis WIB."><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Daily Progress — WIB</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icons/icon-192.svg"><link rel="stylesheet" href="./css/style.css"></head><body><main class="app"><div class="topbar"><div class="brand"><div class="brand-icon">✓</div><div><strong>Daily Progress</strong><span>Jadwal aktivitas harian</span></div></div><div class="topbar-status"><span class="status-dot"></span><span>GMT+7 · WIB</span></div></div><section class="top-grid"><header class="panel clock-panel"><div class="panel-glow"></div><div class="clock-top"><div><div class="label">Waktu sekarang</div><div id="clock" class="clock">00:00:00</div></div><div id="dateLabel" class="date-chip">—</div></div><div class="day-progress-wrap"><div class="progress-heading"><span class="label">Progress hari</span><span id="dayPercent" class="percent-value">0.00%</span></div><div class="progress-track progress-day" role="progressbar" aria-label="Progress 24 jam" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="dayBar"></div></div><div class="progress-scale"><span>00:00</span><span>12:00</span><span>24:00</span></div></div></header><section class="panel current-panel"><div class="label">Sekarang</div><div id="currentActivity" class="current-activity">Tidak ada aktivitas</div><div class="current-meta"><div class="meta-box"><span>Mulai</span><strong id="activityStart">--:--</strong></div><div class="meta-line"></div><div class= ton class="primary-btn" type="submit">Simpan Jadwal</button></div></div></form></div></dialog><script src="./js/schedule.js"></script><script src="./js/app.js"></script><script>if("serviceWorker"in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{});});}</script></body></html>
