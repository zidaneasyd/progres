<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#09090b"
  />

  <meta
    name="description"
    content="Daily Progress — jadwal dan progress aktivitas harian berbasis WIB."
  />

  <meta
    name="mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <title>Daily Progress — WIB</title>

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  />

  <link
    rel="icon"
    href="./icons/icon-192.svg"
    type="image/svg+xml"
  />

  <link
    rel="apple-touch-icon"
    href="./icons/icon-192.svg"
  />

  <link
    rel="stylesheet"
    href="./css/style.css"
  />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              "Inter",
              "-apple-system",
              "BlinkMacSystemFont",
              "Segoe UI",
              "sans-serif"
            ]
          },
          boxShadow: {
            panel: "0 10px 40px rgba(0,0,0,.25)",
            glow: "0 0 30px rgba(255,255,255,.08)"
          }
        }
      }
    };
  </script>
</head>

<body class="bg-zinc-950 text-white font-sans">

  <main class="app w-full max-w-6xl mx-auto">

    <!-- TOP AREA -->
    <section class="grid gap-3 lg:grid-cols-[1.4fr_1fr]">

      <!-- CLOCK PANEL -->
      <header class="panel relative overflow-hidden p-5 sm:p-6">

        <div class="absolute inset-0 pointer-events-none bg-gradient-to-br from-white/[0.035] to-transparent"></div>

        <div class="relative flex h-full flex-col justify-between gap-6">

          <div class="flex items-start justify-between gap-4">

            <div>
              <div class="label">
                Waktu sekarang
              </div>

              <div
                id="clock"
                class="mt-2 text-5xl font-bold leading-none tracking-[-0.06em] sm:text-6xl"
              >
                00:00:00
              </div>
            </div>

            <div class="timezone whitespace-nowrap">
              GMT+7 · WIB
            </div>

          </div>

          <!-- DAY PROGRESS -->
          <div>

            <div class="mb-2 flex items-center justify-between">

              <div class="label">
                Progress hari
              </div>

              <div
                id="dayPercent"
                class="percent-value"
              >
                0%
              </div>

            </div>

            <div
              class="progress-track progress-day"
              role="progressbar"
              aria-label="Progress 24 jam"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div id="dayBar">
                <span class="progress-shine"></span>
              </div>
            </div>

            <div class="mt-2 flex justify-between text-[10px] text-zinc-600">
              <span>00:00</span>
              <span>12:00</span>
              <span>24:00</span>
            </div>

          </div>

        </div>

      </header>


      <!-- CURRENT PANEL -->
      <section class="panel current-panel p-5 sm:p-6">

        <div class="label">
          Sekarang
        </div>

        <div
          id="currentActivity"
          class="mt-3 text-2xl font-bold leading-tight tracking-[-0.03em] sm:text-3xl"
        >
          —
        </div>

        <div class="mt-6">

          <div class="mb-2 flex items-center justify-between">

            <span class="text-[10px] uppercase tracking-[0.14em] text-zinc-600">
              Progress aktivitas
            </span>

            <span
              id="activityPercent"
              class="percent-value"
            >
              0%
            </span>

          </div>

          <div
            class="progress-track progress-activity"
            role="progressbar"
            aria-label="Progress aktivitas"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div id="activityBar">
              <span class="progress-shine"></span>
            </div>
          </div>

          <div class="mt-2 flex justify-between text-[11px] text-zinc-600">
            <span id="activityStart">--:--</span>
            <span id="activityEnd">--:--</span>
          </div>

        </div>

      </section>

    </section>


    <!-- SCHEDULE PANEL -->
    <section class="panel schedule-panel mt-3 p-4 sm:p-5">

      <div class="mb-3 flex items-center justify-between">

        <div class="label">
          Jadwal hari ini
        </div>

        <div
          id="scheduleCount"
          class="text-[10px] uppercase tracking-[0.12em] text-zinc-600"
        >
          0 aktivitas
        </div>

      </div>

      <div
        id="scheduleList"
        class="schedule-grid"
      ></div>

    </section>

  </main>


  <script src="./js/schedule.js"></script>
  <script src="./js/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>

</body>
</html>
