<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Daily Progress — WIB</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />
</head>

<body>

  <main class="app">

    <!-- Header -->
    <header class="header">

      <div>
        <div class="label">
          Waktu sekarang
        </div>

        <div id="clock">
          00:00:00
        </div>
      </div>

      <div class="timezone">
        GMT+7 · WIB
      </div>

    </header>


    <!-- Progress 24 Jam -->
    <section class="day">

      <div class="day-progress">
        <div id="dayBar"></div>
      </div>

      <div class="day-info">
        <span>00:00</span>
        <span>12:00</span>
        <span>24:00</span>
      </div>

    </section>


    <!-- Aktivitas Sekarang -->
    <section class="current">

      <div class="label">
        Sekarang
      </div>

      <h2 id="currentActivity">
        —
      </h2>

      <div class="activity-progress">
        <div id="activityBar"></div>
      </div>

      <div class="activity-time">
        <span id="activityStart">
          --:--
        </span>

        <span id="activityEnd">
          --:--
        </span>
      </div>

    </section>


    <!-- Jadwal -->
    <section class="schedule">

      <div class="schedule-title">
        Jadwal hari ini
      </div>

      <div id="scheduleList"></div>

    </section>

  </main>


  <script src="js/schedule.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
